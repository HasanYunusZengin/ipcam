name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned release app
        run: >-
          xcodebuild -project USBCameraStreamer.xcodeproj
          -scheme USBCameraStreamer
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/USBCameraStreamer.app Payload/
          zip -r USBCameraStreamer.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: USBCameraStreamer-IPA
          path: USBCameraStreamer.ipa
